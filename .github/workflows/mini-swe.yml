name: Run mini-SWE-Agent

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      task:
        description: 'Describe the task or issue for the agent to fix'
        required: true
        type: string

jobs:
  solve-issue:
    runs-on: ubuntu-latest
    
    # Permissions required to modify files and push changes back
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv and run mini-swe-agent
        env:
          # Replace with your preferred model provider keys (e.g., ANTHROPIC_API_KEY, OPENAI_API_KEY)
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }} 
          # Determine the instruction source depending on how the workflow was triggered
          TASK_INSTRUCTION: ${{ github.event.inputs.task || github.event.issue.body }}
        run: |
          pip install uv
          # Run the agent over your repository codebase using the provided instruction
          uvx mini-swe-agent --task "$TASK_INSTRUCTION"

      - name: Create Pull Request with Fixes
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "fix: automated changes by mini-swe-agent"
          title: "🤖 mini-SWE-Agent automated fix"
          body: "This PR was automatically generated by mini-swe-agent in response to the requested task."
          branch: "mini-swe-fix"
